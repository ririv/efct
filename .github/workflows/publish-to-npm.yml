name: Publish release to npm

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build npm release artifacts run ID for this commit
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: Publish verified npm candidate
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/efct
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm build run
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["BUILD_RUN_ID"]
          request = Request(
              f"https://api.github.com/repos/{repository}/actions/runs/{run_id}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urlopen(request) as response:
              run = json.load(response)

          expected = {
              "conclusion": "success",
              "event": "workflow_dispatch",
              "head_sha": os.environ["EXPECTED_SHA"],
              "path": ".github/workflows/npm-release-artifacts.yml",
          }
          mismatches = {
              field: {"expected": value, "actual": run.get(field)}
              for field, value in expected.items()
              if run.get(field) != value
          }
          if mismatches:
              raise SystemExit(
                  "npm build run does not match this release source: "
                  f"{mismatches}"
              )
          PY

      - name: Download verified npm candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          name: npm-package
          path: candidate
          run-id: ${{ inputs.build_run_id }}

      - name: Verify checksum and publication identity
        run: |
          cd candidate
          sha256sum --check SHA256SUMS
          cd ..
          python - <<'PY'
          import json
          import tarfile
          from pathlib import Path

          source = json.loads(Path("js/efct/package.json").read_text(encoding="utf-8"))
          packages = list(Path("candidate").glob("efct-*.tgz"))
          if len(packages) != 1:
              raise SystemExit(f"expected one npm candidate, found {packages}")
          with tarfile.open(packages[0], "r:gz") as archive:
              member = archive.extractfile("package/package.json")
              if member is None:
                  raise SystemExit("npm candidate is missing package.json")
              candidate = json.load(member)
          if source.get("private") is not False or candidate.get("private") is not False:
              raise SystemExit("npm publication remains disabled by private: true")
          expected = {"name": "@efct/efct", "version": "0.1.0"}
          for field, value in expected.items():
              if source.get(field) != value or candidate.get(field) != value:
                  raise SystemExit(
                      f"unexpected npm {field}: source={source.get(field)!r}, "
                      f"candidate={candidate.get(field)!r}"
                  )
          if candidate.get("repository") != source.get("repository"):
              raise SystemExit("npm candidate repository does not match release source")
          PY

      - name: Publish to npm with trusted publishing
        run: npm publish candidate/efct-*.tgz --access public
