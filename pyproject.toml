[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "efct"
version = "0.1.0"
description = "Static effect and pure-function verification for a closed Python subset"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Efct contributors" }]
keywords = ["effect-system", "purity", "static-analysis", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/ririv/efct"
Issues = "https://github.com/ririv/efct/issues"

[project.scripts]
efct = "efct.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.411,<2",
    "pytest>=8.4,<9",
    "ruff>=0.16,<0.17",
]

[tool.ruff]
target-version = "py313"
extend-exclude = ["tests/acceptance/rejected"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF022"]

[tool.maturin]
manifest-path = "crates/pyext/Cargo.toml"
python-source = "python"
module-name = "efct._core"
features = ["pyo3/extension-module"]
include = [
    { path = "README.zh-CN.md", format = "sdist" },
]
exclude = ["AGENTS.md", "history/**/*", "internal-docs/**/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
